<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="tic.css">
</head>
<body>
  <main class="game">
    <header class="game-header">
      <div>
        <p class="eyebrow">Classic game</p>
        <h1>Tic Tac Toe</h1>
      </div>
      <button class="icon-button" id="newMatchBtn" type="button" aria-label="Start a new match" title="New match">
        <span aria-hidden="true">&#8635;</span>
      </button>
    </header>

    <section class="scoreboard" aria-label="Scoreboard">
      <div class="score score-x active" id="playerXScore">
        <span class="score-mark">X</span>
        <span>
          <small>Player</small>
          <strong id="scoreX">0</strong>
        </span>
      </div>
      <div class="draws">
        <small>Draws</small>
        <strong id="scoreDraw">0</strong>
      </div>
      <div class="score score-o" id="playerOScore">
        <span>
          <small>Player</small>
          <strong id="scoreO">0</strong>
        </span>
        <span class="score-mark">O</span>
      </div>
    </section>

    <div id="status" class="status" role="status" aria-live="polite">
      <span class="turn-mark">X</span>
      <span>Your turn</span>
    </div>

    <div class="board" id="board" role="grid" aria-label="Tic tac toe board"></div>

    <button id="resetBtn" class="reset-button" type="button">Play again</button>
  </main>
  <script src="games.js"></script>
</body>
</html>
